<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas Premium</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --container-bg: rgba(17, 24, 39, 0.7);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.08);
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-hover-bg: rgba(255, 255, 255, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Decorative ambient glow background */
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(99, 102, 241, 0) 70%);
            top: -100px;
            right: -100px;
            z-index: -1;
        }

        body::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, rgba(16, 185, 129, 0) 70%);
            bottom: -150px;
            left: -150px;
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .task-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2.5rem;
            background: rgba(255, 255, 255, 0.02);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0.8rem 1rem;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0.9rem 1.5rem;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .tasks-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .task-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.2rem;
            transition: all 0.2s ease;
        }

        .task-card:hover {
            background: var(--card-hover-bg);
            border-color: rgba(99, 102, 241, 0.3);
            transform: translateY(-2px);
        }

        .task-card.completed {
            opacity: 0.6;
        }

        .task-left {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            flex: 1;
        }

        .toggle-btn {
            background: none;
            border: none;
            cursor: pointer;
            margin-top: 0.2rem;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .toggle-btn:hover {
            color: var(--success);
        }

        .task-card.completed .toggle-btn {
            color: var(--success);
        }

        .toggle-icon {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .task-details {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .task-title {
            font-weight: 600;
            font-size: 1.05rem;
            transition: text-decoration 0.2s;
        }

        .task-card.completed .task-title {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .task-desc {
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .task-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            border-radius: 8px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        .action-btn.btn-delete:hover {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.2);
        }

        .action-icon {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-content {
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2rem;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: modalFadeIn 0.3s ease;
        }

        @keyframes modalFadeIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .close-btn:hover {
            color: var(--text-main);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Minha Lista</h1>
            <p>Organize suas tarefas com elegância</p>
        </header>

        <!-- Form to Add Task -->
        <form class="task-form" action="/add" method="POST">
            <div class="input-group">
                <label for="title">Título da Tarefa</label>
                <input type="text" id="title" name="title" class="form-input" placeholder="O que você precisa fazer?" required>
            </div>
            <div class="input-group">
                <label for="description">Descrição (Opcional)</label>
                <input type="text" id="description" name="description" class="form-input" placeholder="Adicione alguns detalhes...">
            </div>
            <button type="submit" class="btn">
                <svg class="toggle-icon" style="width:18px; height:18px;" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                Adicionar Tarefa
            </button>
        </form>

        <!-- Tasks List -->
        <div class="tasks-list">
            {% if tasks %}
                {% for task in tasks %}
                    <div class="task-card {% if task.completed %}completed{% endif %}">
                        <div class="task-left">
                            <form action="/toggle/{{ task.id }}" method="POST" style="margin: 0;">
                                <button type="submit" class="toggle-btn" title="Marcar como concluída/pendente">
                                    {% if task.completed %}
                                        <svg class="toggle-icon" viewBox="0 0 24 24">
                                            <rect x="3" y="3" width="18" height="18" rx="5" fill="#10b981" stroke="#10b981"/>
                                            <path d="M9 12l2 2 4-4" stroke="white" stroke-width="2"/>
                                        </svg>
                                    {% else: %}
                                        <svg class="toggle-icon" viewBox="0 0 24 24">
                                            <rect x="3" y="3" width="18" height="18" rx="5" stroke="var(--text-muted)" fill="none"/>
                                        </svg>
                                    {% endif %}
                                </button>
                            </form>
                            <div class="task-details">
                                <span class="task-title">{{ task.title }}</span>
                                {% if task.description %}
                                    <span class="task-desc">{{ task.description }}</span>
                                {% endif %}
                            </div>
                        </div>
                        <div class="task-actions">
                            <button type="button" class="action-btn" title="Editar" onclick="openEditModal('{{ task.id }}', '{{ task.title|escape }}', '{{ task.description|escape }}')">
                                <svg class="action-icon" viewBox="0 0 24 24">
                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                                </svg>
                            </button>
                            <form action="/delete/{{ task.id }}" method="POST" style="margin: 0;" onsubmit="return confirm('Deseja excluir esta tarefa?');">
                                <button type="submit" class="action-btn btn-delete" title="Excluir">
                                    <svg class="action-icon" viewBox="0 0 24 24">
                                        <polyline points="3 6 5 6 21 6"/>
                                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                                        <line x1="10" y1="11" x2="10" y2="17"/>
                                        <line x1="14" y1="11" x2="14" y2="17"/>
                                    </svg>
                                </button>
                            </form>
                        </div>
                    </div>
                {% endfor %}
            {% else %}
                <div class="empty-state">
                    <span class="empty-icon">🎉</span>
                    <p>Tudo pronto! Você não tem nenhuma tarefa pendente.</p>
                </div>
            {% endif %}
        </div>
    </div>

    <!-- Edit Task Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Editar Tarefa</h2>
                <button type="button" class="close-btn" onclick="closeEditModal()">&times;</button>
            </div>
            <form id="editForm" method="POST">
                <div class="input-group" style="margin-bottom: 1rem;">
                    <label for="edit_title">Título</label>
                    <input type="text" id="edit_title" name="title" class="form-input" required>
                </div>
                <div class="input-group">
                    <label for="edit_description">Descrição</label>
                    <input type="text" id="edit_description" name="description" class="form-input">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancelar</button>
                    <button type="submit" class="btn">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function openEditModal(id, title, description) {
            const modal = document.getElementById('editModal');
            const form = document.getElementById('editForm');
            const titleInput = document.getElementById('edit_title');
            const descInput = document.getElementById('edit_description');

            form.action = '/edit/' + id;
            titleInput.value = title;
            descInput.value = description;

            modal.style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        // Close modal when clicking outside of it
        window.onclick = function(event) {
            const modal = document.getElementById('editModal');
            if (event.target == modal) {
                closeEditModal();
            }
        }
    </script>
</body>
</html>
